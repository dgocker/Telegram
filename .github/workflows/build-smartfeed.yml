name: Build Smart Feed APK

on:
  push:
    branches: [ smart-feed ]
  workflow_dispatch:

concurrency:
  group: smartfeed-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CCACHE_DIR: /home/runner/.ccache
      # cmake >= 3.17 подхватывает лаунчеры из env — build.gradle трогать не нужно
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      # sdkmanager ставит NDK заново каждый прогон → mtime компилятора меняется;
      # без content-check это инвалидирует 100% кэша (проверено: 0/8068 хитов)
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install ccache
        run: sudo apt-get install -y ccache

      - name: Restore native build cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-ndk-v2-${{ hashFiles('TMessagesProj/jni/**/*.c', 'TMessagesProj/jni/**/*.cpp', 'TMessagesProj/jni/**/*.h', 'TMessagesProj/jni/**/CMakeLists.txt') }}
          restore-keys: |
            ccache-ndk-v2-

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Build standalone afat (arm64-v8a)
        run: |
          set -o pipefail
          ccache -z || true
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone --console=plain 2>&1 | tee build.log
          ccache -s || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smartfeed-apk
          path: TMessagesProj_AppStandalone/build/outputs/apk/afat/standalone/app.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
